name: PR description test

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Append marker to PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body=$(gh pr view "$PR" --repo "$REPO" --json body -q .body || true)
          if ! printf '%s' "$body" | grep -q 'required-workflow-test: ran'; then
            printf '%s\n\n<!-- required-workflow-test: ran -->\n' "$body" > body.md
            gh pr edit "$PR" --repo "$REPO" --body-file body.md || echo "PR edit failed"
          fi
          exit 0
